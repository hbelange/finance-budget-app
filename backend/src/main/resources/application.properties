spring.application.name=financebudgetapp

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/budget}
spring.datasource.username=${DB_USERNAME:budget}
spring.datasource.password=${DB_PASSWORD:budget}

# CORS
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Auth0
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-pbo6b7xkaou1ofah.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://finance-budget-api

# Demo mode: when enabled, DemoDataService.reset() wipes and reseeds this user's data on
# startup and every hour. Off by default so local dev and tests are unaffected.
app.demo.enabled=${DEMO_ENABLED:false}
app.demo.user-sub=auth0|6a83a3c9fbc136f08d2e9e77
